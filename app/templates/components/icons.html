{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

{% if name == 'inicio' %}<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>

{% elif name == 'planejamento' %}<rect x="3" y="5" width="18" height="16" rx="2"/>
<path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>

{% elif name == 'diario' %}<path d="M12 5c-3-2-6-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-4-1-7-1-10 1v15M6 8h2M6 12h2M16 8h2M16 12h2"/>

{% elif name == 'prestacao-de-contas' %}<path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM9 7h6M9 11h6M9 15h3"/>

{% elif name in ['organizacao', 'documentos'] %}<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>

{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>

{% elif name == 'chevron' %}<path d="m8 10 4 4 4-4"/>

{% elif name == 'pin' %}<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/>
<circle cx="12" cy="10" r="2"/>

{% elif name == 'people' %}<circle cx="9" cy="8" r="3"/>
<path d="M3 21v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-4-5"/>

{% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/>
<ellipse cx="12" cy="12" rx="4" ry="9"/>
<path d="M3 12h18"/>

{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>

{% elif name == 'back' %}<path d="M20 12H4m6-6-6 6 6 6"/>

{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>

{% elif name == 'target' %}<circle cx="12" cy="12" r="9"/>
<circle cx="12" cy="12" r="5"/>
<circle cx="12" cy="12" r="1"/>

{% endif %}
</svg>
{%- endmacro %}
